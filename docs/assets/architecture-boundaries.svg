<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">POLICY//AUDIT system boundaries</title>
  <desc id="desc">A local browser pipeline with deterministic verdicts, optional model tags, and human review.</desc>
  <rect width="1200" height="520" rx="18" fill="#0b1020"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="34" y="44" width="1132" height="300" rx="16" fill="#101a2b" stroke="#2b4059" stroke-width="2"/>
    <text x="60" y="82" fill="#38bdf8" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">LOCAL BROWSER BOUNDARY</text>
    <g fill="#16263b" stroke="#38bdf8" stroke-width="2">
      <rect x="65" y="130" width="190" height="100" rx="10"/><rect x="300" y="130" width="190" height="100" rx="10"/><rect x="535" y="130" width="190" height="100" rx="10"/><rect x="770" y="130" width="190" height="100" rx="10"/>
    </g>
    <g fill="#eef5ff" font-size="18" font-weight="700" text-anchor="middle"><text x="160" y="170">PARSE</text><text x="395" y="170">EXTRACT</text><text x="630" y="170">MATCH</text><text x="865" y="170">FINDINGS</text></g>
    <g fill="#9fb0c5" font-size="13" text-anchor="middle"><text x="160" y="198">PDF · DOCX · XLSX</text><text x="395" y="198">patterns + chunks</text><text x="630" y="198">requirements + evidence</text><text x="865" y="198">status + severity + gaps</text></g>
    <g fill="none" stroke="#8b5cf6" stroke-width="3"><path d="M255 180h45m190 0h45m190 0h45"/></g>
    <g fill="#8b5cf6"><path d="m292 172 12 8-12 8z"/><path d="m527 172 12 8-12 8z"/><path d="m762 172 12 8-12 8z"/></g>
    <rect x="990" y="130" width="145" height="100" rx="10" fill="#211d26" stroke="#d6b36a" stroke-width="2"/>
    <text x="1062" y="166" fill="#d6b36a" font-size="16" font-weight="700" text-anchor="middle">HUMAN</text><text x="1062" y="190" fill="#d6b36a" font-size="16" font-weight="700" text-anchor="middle">REVIEW</text>
    <path d="M960 180h30" stroke="#d6b36a" stroke-width="3"/><path d="m985 172 12 8-12 8z" fill="#d6b36a"/>
    <rect x="250" y="395" width="700" height="78" rx="12" fill="#171b2a" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="600" y="427" fill="#c8b9ff" font-size="17" font-weight="700" text-anchor="middle">OPTIONAL MODEL ENHANCEMENT</text>
    <text x="600" y="451" fill="#aab8ca" font-size="14" text-anchor="middle">May append tags; never determines or overrides a verdict.</text>
    <path d="M600 395V344" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 6"/>
  </g>
</svg>
