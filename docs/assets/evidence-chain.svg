<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">POLICY//AUDIT evidence chain</title>
  <desc id="desc">Five connected stages: regulation, control, implementation, evidence, and gap.</desc>
  <rect width="1200" height="280" rx="18" fill="#0b1020"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g fill="#111c2d" stroke="#38bdf8" stroke-width="2">
      <rect x="35" y="82" width="180" height="112" rx="12"/><rect x="255" y="82" width="180" height="112" rx="12"/><rect x="475" y="82" width="180" height="112" rx="12"/><rect x="695" y="82" width="180" height="112" rx="12"/><rect x="915" y="82" width="250" height="112" rx="12" stroke="#d6b36a"/>
    </g>
    <g fill="#eef5ff" font-size="18" font-weight="700"><text x="125" y="128">REGULATION</text><text x="345" y="128">CONTROL</text><text x="565" y="128">IMPLEMENTATION</text><text x="785" y="128">EVIDENCE</text><text x="1040" y="128">GAP / FINDING</text></g>
