    <g fill="none" stroke="#8b5cf6" stroke-width="3"><path d="M215 138h40m180 0h40m180 0h40m180 0h40"/></g>
    <g fill="#8b5cf6"><path d="m247 130 12 8-12 8z"/><path d="m467 130 12 8-12 8z"/><path d="m687 130 12 8-12 8z"/><path d="m907 130 12 8-12 8z"/></g>
  </g>
